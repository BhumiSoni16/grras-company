<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#111;
            color:white;
        }

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 50px;
            background:black;
        }

        .logo{
            color:red;
            font-size:38px;
            font-weight:bold;
        }

        .hero{
            height:85vh;
            background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920') no-repeat center center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
        }

        .hero-content{
            background:rgba(0,0,0,0.7);
            padding:40px;
            border-radius:10px;
        }

        .hero-content h1{
            font-size:60px;
            margin-bottom:20px;
        }

        .hero-content p{
            font-size:22px;
            margin-bottom:20px;
        }

        .btn{
            padding:12px 25px;
            background:red;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:18px;
        }

        .movies{
            padding:40px;
        }

        .movies h2{
            margin-bottom:20px;
        }

        .movie-row{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .movie-card{
            width:300px;
            background:#222;
            border-radius:10px;
            overflow:hidden;
            transition:0.3s;
        }

        .movie-card:hover{
            transform:scale(1.05);
        }

        .movie-card img{
            width:100%;
            height:180px;
            object-fit:cover;
        }

        .movie-info{
            padding:15px;
        }

        .movie-info h3{
            margin-bottom:10px;
        }

        .trailer-btn{
            display:inline-block;
            margin-top:10px;
            padding:10px 15px;
            background:red;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        iframe{
            width:100%;
            height:180px;
            border:none;
        }

        footer{
            text-align:center;
            padding:20px;
            background:black;
            margin-top:40px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">NETFLIX</div>
        <button class="btn">Sign In</button>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <div class="hero-content">
            <h1>Unlimited Movies, TV Shows & More</h1>
            <p>Watch trailers directly inside the website</p>
            <button class="btn">Watch Now</button>
        </div>
    </div>

    <!-- Movies Section -->
    <div class="movies">
        <h2>Trending Trailers</h2>

        <div class="movie-row">

            <!-- Movie 1 -->
            <div class="movie-card">
                <iframe src="https://www.youtube.com/embed/TcMBFSGVi1c"
                allowfullscreen></iframe>

                <div class="movie-info">
                    <h3>Avengers Endgame</h3>

                    <a class="trailer-btn"
                    href="https://www.youtube.com/watch?v=TcMBFSGVi1c"
                    target="_blank">
                    Watch Trailer
                    </a>
                </div>
            </div>

            <!-- Movie 2 -->
            <div class="movie-card">
                <iframe src="https://www.youtube.com/embed/EXeTwQWrcwY"
                allowfullscreen></iframe>

                <div class="movie-info">
                    <h3>The Dark Knight</h3>

                    <a class="trailer-btn"
                    href="https://www.youtube.com/watch?v=EXeTwQWrcwY"
                    target="_blank">
                    Watch Trailer
                    </a>
                </div>
            </div>

            <!-- Movie 3 -->
            <div class="movie-card">
                <iframe src="https://www.youtube.com/embed/6ZfuNTqbHE8"
                allowfullscreen></iframe>

                <div class="movie-info">
                    <h3>Infinity War</h3>

                    <a class="trailer-btn"
                    href="https://www.youtube.com/watch?v=6ZfuNTqbHE8"
                    target="_blank">
                    Watch Trailer
                    </a>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>Netflix Clone © 2026</p>
    </footer>

</body>
</html>
